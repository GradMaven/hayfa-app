services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hafya
      POSTGRES_PASSWORD: hafya_dev_password
      POSTGRES_DB: hafya_dev
    ports:
      - "5432:5432"
    volumes:
      - hafya_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hafya -d hafya_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hafya_minio
      MINIO_ROOT_PASSWORD: hafya_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hafya_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hafya_postgres_data:
  hafya_minio_data:
