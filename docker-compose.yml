services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hafya
      POSTGRES_PASSWORD: hafya_dev_password
      POSTGRES_DB: hafya_dev
    ports:
      - "5432:5432"
    volumes:
      - hafya_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hafya -d hafya_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hafya_minio
      MINIO_ROOT_PASSWORD: hafya_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hafya_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP catcher — receives every email the app sends without
  # delivering anywhere real, and shows them in a web UI. Point
  # EMAIL_PROVIDER=smtp + SMTP_HOST=localhost + SMTP_PORT=1025 at this for
  # local dev; swap those three vars for a real vendor's SMTP credentials in
  # production — the app code doesn't change either way.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local malware scanner (§18 upload pipeline: "Upload → Virus/security
  # scan → OCR → ..."). Real ClamAV, not a mock — MALWARE_SCAN_PROVIDER=clamav
  # + CLAMAV_HOST=localhost + CLAMAV_PORT=3310 (the .env.example defaults)
  # point at this daemon. First startup downloads virus definitions
  # (freshclam) and can take several minutes — the healthcheck's long
  # start_period accounts for that; app requests will fail closed (not
  # silently "clean") until it reports healthy. A production deployment
  # points the same three env vars at any ClamAV instance reachable over
  # TCP — this container is for local dev only.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - hafya_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m

volumes:
  hafya_postgres_data:
  hafya_minio_data:
  hafya_clamav_data:
